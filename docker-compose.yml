# Baali-Patro (बाली-पात्रो) — full stack: PostgreSQL + Django API + Next.js
#
#   docker compose up --build
#
# Then open:  http://localhost:3000        (frontend, /en and /ne)
#             http://localhost:8000/api/v1 (Django REST API)

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: baali_patro
      POSTGRES_USER: baali
      POSTGRES_PASSWORD: baali_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baali -d baali_patro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://baali:baali_secret@db:5432/baali_patro
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_ALLOWED_HOSTS: "backend,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      ADVISORY_REGEN_TOKEN: change-me-regen-token
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # Server-side fetches (RSC) go straight to the backend container.
      API_BASE_URL: http://backend:8000
      # Browser-visible base (only used for links, not data fetching).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
